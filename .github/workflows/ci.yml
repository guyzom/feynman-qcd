name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pages build
        run: npm run build -- --base=/feynman-qcd/
      - name: Offline build
        run: npm run build:standalone
      - name: Browser verification
        run: npm run test:browser
      - name: Application builds
        uses: actions/upload-artifact@v4
        with:
          name: feynman-qcd-builds
          path: |
            dist/
            dist-standalone/
          if-no-files-found: error
      - name: Browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
